<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050"><rect width="1400" height="1050" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="#758895"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#142b3c}.h{font-size:38px;font-weight:bold}.n{font-size:27px;font-weight:bold}.s{font-size:22px;fill:#546b7a}</style><text x="65" y="75" class="h" text-anchor="start">From Slice Request to UPF Selection</text><rect x="100" y="140" width="800" height="110" rx="16" fill="#f3f6fa" stroke="#a8b7c3" stroke-width="2"/><text x="500" y="184" class="n" text-anchor="middle">1  UE requests slices</text><text x="500" y="221" class="s" text-anchor="middle">Requested NSSAI</text><path d="M500 250 V293" stroke="#758895" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="300" width="800" height="110" rx="16" fill="#edf5ff" stroke="#368ccc" stroke-width="2"/><text x="500" y="344" class="n" text-anchor="middle">2  AMF determines allowed slices</text><text x="500" y="381" class="s" text-anchor="middle">Subscription and network availability</text><path d="M500 410 V453" stroke="#758895" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="460" width="800" height="110" rx="16" fill="#edf5ff" stroke="#368ccc" stroke-width="2"/><text x="500" y="504" class="n" text-anchor="middle">3  AMF selects an SMF</text><text x="500" y="541" class="s" text-anchor="middle">For the PDU session: S-NSSAI + DNN</text><path d="M500 570 V613" stroke="#758895" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="620" width="800" height="110" rx="16" fill="#eefaf7" stroke="#249c94" stroke-width="2"/><text x="500" y="664" class="n" text-anchor="middle">4  SMF selects a UPF</text><text x="500" y="701" class="s" text-anchor="middle">S-NSSAI + DNN + configured topology</text><path d="M500 730 V773" stroke="#758895" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="780" width="800" height="110" rx="16" fill="#fff6eb" stroke="#db9149" stroke-width="2"/><text x="500" y="824" class="n" text-anchor="middle">5  SMF configures the UPF</text><text x="500" y="861" class="s" text-anchor="middle">N4 / PFCP session establishment</text><rect x="990" y="300" width="330" height="110" rx="16" fill="#f3f6fa" stroke="#a8b7c3" stroke-width="2"/><text x="1155" y="344" class="n" text-anchor="middle">NSSF</text><text x="1155" y="382" class="s" text-anchor="middle">Selection assistance</text><path d="M990 355 H910" stroke="#758895" stroke-width="3" fill="none" marker-end="url(#a)" stroke-dasharray="8 7"/><text x="1155" y="448" class="s" text-anchor="middle">When needed</text><text x="70" y="965" class="s" text-anchor="start">Conceptual flow across registration and PDU session establishment.</text><text x="70" y="1003" class="s" text-anchor="start">Not a signaling trace or a result verified by this core-only lab.</text></svg>